services:
  - type: web
    name: nepaljobai-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard (Neon connection string)
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: FRONTEND_URL
        sync: false          # e.g. https://nepaljobai.vercel.app
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

  - type: cron
    name: nepaljobai-scraper
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    # 06:00 NPT = 00:15 UTC (NPT is UTC+5:45)
    schedule: "15 0 * * *"
    startCommand: python scripts/scrape_initial.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
